services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: minimi-neo4j
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-minimi-dev-password}
      NEO4J_PLUGINS: '["apoc"]'
      # ADR-011: full-text indexes are transactionally consistent with writes.
      NEO4J_dbms_index_fulltext_eventually__consistent: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:
